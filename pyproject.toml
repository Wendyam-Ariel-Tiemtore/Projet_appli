[project]
name = "analyste-academique"
version = "1.0.0"
description = "Application locale et sécurisée d'analyse statistique et de rédaction académique (rapport, mémoire, article)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wendyam Ariel Tiemtoré" }]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
ignore = ["S101", "S311", "B008", "E731", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
"scripts/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::RuntimeWarning", "ignore::UserWarning",
                  "ignore::FutureWarning"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
