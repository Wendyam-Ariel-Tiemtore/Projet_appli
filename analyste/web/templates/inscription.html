{% extends "base.html" %}
{% block titre %}Créer un compte{% endblock %}
{% block largeur %}etroit{% endblock %}
{% block contenu %}
<h1>Créer un compte</h1>
{% include "_erreurs.html" %}
<form method="post" action="/inscription" autocomplete="off">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="username">Identifiant</label>
  <input id="username" name="username" type="text" required minlength="3" maxlength="32" value="{{ username or '' }}" autocomplete="username">
  <label for="password">Mot de passe <span class="aide">Au moins 12 caractères, avec trois types parmi minuscules, majuscules, chiffres et symboles.</span></label>
  <input id="password" name="password" type="password" required minlength="12" autocomplete="new-password">
  <label for="password2">Confirmer le mot de passe</label>
  <input id="password2" name="password2" type="password" required minlength="12" autocomplete="new-password">
  <div class="actions"><button class="bouton" type="submit">Créer le compte</button></div>
</form>
{% endblock %}
