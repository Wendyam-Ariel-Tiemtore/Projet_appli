name: Publication signée d'une version

# Déclenchement : pousser une étiquette de version, par exemple « git tag -s v1.3.0 -m "Version 1.3.0" »
# puis « git push origin v1.3.0 ». Le flux construit l'image Docker, la publie sur le registre GitHub,
# la signe (Sigstore, sans clé à gérer), produit la nomenclature logicielle (SBOM), l'attestation de
# provenance, et crée la page de version avec l'archive du code, ses empreintes et leurs signatures.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publier:
    name: Image, signatures et page de version
    runs-on: ubuntu-latest
    permissions:
      contents: write        # page de version
      packages: write        # registre ghcr.io
      id-token: write        # signature Sigstore sans clé
      attestations: write    # attestation de provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cohérence entre l'étiquette et la version du code
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "__version__ = \"$VERSION\"" analyste/__init__.py
          grep -q "^version = \"$VERSION\"" pyproject.toml

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nom de l'image (minuscules exigées par le registre)
        id: nom
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/analyste-academique" >> "$GITHUB_OUTPUT"

      - name: Construction et publication
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.nom.outputs.image }}:${{ github.ref_name }}
            ${{ steps.nom.outputs.image }}:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Signature de l'image (Sigstore, sans clé)
        run: cosign sign --yes "${{ steps.nom.outputs.image }}@${{ steps.image.outputs.digest }}"

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.nom.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Nomenclature logicielle (SBOM SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.nom.outputs.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: sbom-analyste-academique.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Archive du code, empreintes et signatures
        run: |
          NOM="analyste-academique-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="$NOM/" -o "$NOM.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "$NOM.tar.gz" sbom-analyste-academique.spdx.json > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          echo "Image : ${{ steps.nom.outputs.image }}@${{ steps.image.outputs.digest }}" > IMAGE.txt

      - name: Page de version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOM="analyste-academique-${GITHUB_REF_NAME}"
          gh release create "$GITHUB_REF_NAME" --title "Analyste académique ${GITHUB_REF_NAME}" \
            --notes-file <(awk -v v="## ${GITHUB_REF_NAME#v} " 'index($0, v) == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md) \
            "$NOM.tar.gz" sbom-analyste-academique.spdx.json SHA256SUMS SHA256SUMS.sigstore.json IMAGE.txt
