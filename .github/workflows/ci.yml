name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualite-et-tests:
    name: Tests, analyse statique et audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Installation
        run: pip install -r requirements-dev.txt
      - name: Style et erreurs courantes (ruff)
        run: ruff check .
      - name: Analyse de sécurité du code (bandit)
        run: bandit -q -r analyste -c pyproject.toml
      - name: Vulnérabilités connues des dépendances (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Tests automatisés
        run: pytest -q

  image-docker:
    name: Construction et démarrage de l'image
    needs: qualite-et-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construction
        run: docker build -t analyste-academique:ci .
      - name: Démarrage durci et contrôle de santé
        run: |
          docker run -d --name aa -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp:size=512m \
            --cap-drop ALL --security-opt no-new-privileges:true -v aa_donnees:/donnees \
            -e ANALYSTE_ALLOWED_HOSTS='["localhost","127.0.0.1"]' analyste-academique:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/sante; then exit 0; fi
            sleep 2
          done
          docker logs aa
          exit 1
      - name: En-têtes de sécurité
        run: |
          curl -sS -o /dev/null -D headers.txt http://127.0.0.1:8000/installation
          cat headers.txt
          grep -qi "^content-security-policy:" headers.txt
          grep -qi "^x-frame-options: DENY" headers.txt
          grep -qi "^strict-transport-security:" headers.txt

  pile-complete:
    name: Pile Docker complète (proxy HTTPS)
    needs: qualite-et-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validation de la configuration du proxy
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Démarrage comme sur un poste personnel
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Accès par https://localhost et https://127.0.0.1 (sans SNI)
        run: |
          for i in $(seq 1 40); do
            if docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt ca.crt 2>/dev/null \
               && curl -fsS --cacert ca.crt https://localhost/sante \
               && curl -fsS --cacert ca.crt https://127.0.0.1/sante; then
              curl -sS -o /dev/null -w "HTTP -> %{http_code} %{redirect_url}\n" http://localhost/
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1
